# On every push and pull request:
# - typecheck and unit tests, on Linux and on Windows
# - a launch check on Windows and a Mac: build the real app, open it with CLUELESS_SMOKE=1
#   (every window loads, a little Python runs and is drawn), and fail if it doesn't pass
# - the server functions' typecheck
name: Tests

on:
  push:
  pull_request:

jobs:
  app:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1' # the unit tests don't open Electron
      - run: npm run typecheck
      - run: npm test

  launch:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build: --win dir nsis --x64 # nsis: the installer, for testing on a real PC
            app: dist/win-unpacked/Clueless.exe
          - os: macos-latest
            build: --mac dir --arm64
            app: dist/mac-arm64/Clueless.app/Contents/MacOS/Clueless
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx electron-vite build
      - run: npx electron-builder ${{ matrix.build }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Open the app and check every window works
        env:
          CLUELESS_SMOKE: '1'
        # The app exits 0 when every check passed (pipefail passes that on through tee).
        run: timeout 240 "${{ matrix.app }}" 2>&1 | tee smoke.log
      - name: Keep the Windows installer for hands-on testing (WINDOWS_TEST.md)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Clueless-Setup-windows
          path: app/dist/Clueless-Setup.exe
          retention-days: 14

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check ai/index.ts voice/index.ts
